id: S1
title: The primary returns 500 on half its requests
release: v0.1
description: >-
  For the whole run, the first model in the route answers half its requests with HTTP 500
  before sending anything. Retries on the same provider are limited by the retry budget,
  failover is not, and the breaker should open on the 40% rule and keep traffic away.
topology:
  gateway: Switchyard, route group `mock` (mock-a/mock first, then mock-b/mock)
  primary: mockllm behind a gate, serving mock-a/mock
  secondary: mockllm behind a gate, serving mock-b/mock
traffic:
  model: mock
  rate_rps: 10
  duration_s: 120
seeds: [1, 2, 3, 4, 5]
faults:
  - upstream: primary
    mode: error_rate
    params: { rate: 0.5, status: 500 }
    start_s: 0
    duration_s: 120
checks:
  - kind: success_rate
    description: Requests that completed
    min: 0.99
  - kind: breaker_opens
    description: The primary's breaker opens
    model: mock-a/mock
