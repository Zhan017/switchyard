[project]
name = "switchyard"
version = "0.0.1"
description = "An LLM gateway that finishes a streamed answer on another provider when the first one dies mid-stream, and measures how well that works."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Zhan Kuatuly" }]
dependencies = [
    "aiohttp>=3.11",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "orjson>=3.10",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    "redis>=5.2",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
switchyard-chaos = "chaos.cli:main"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "fakeredis[lua]>=2.26",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "openai>=1.60",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchyard", "src/mockllm", "chaos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "eval", "tests", "bench", "scripts", "chaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
